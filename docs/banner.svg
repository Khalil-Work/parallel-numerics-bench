<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Parallel Numerics Bench banner">
  <defs>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a44"/>
      <stop offset="0.5" stop-color="#1f3a44"/>
      <stop offset="0.5" stop-color="#2e6da4"/>
      <stop offset="1" stop-color="#2e6da4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#split)"/>
  <!-- diagonal divider -->
  <path d="M 0 300 L 520 0 L 560 0 L 40 300 Z" fill="#0c1a20" opacity="0.55"/>
  <!-- serial column (left, one worker) -->
  <g transform="translate(70,60)">
    <rect x="0" y="0" width="26" height="180" fill="#0c1a20" stroke="#9fc4d4" stroke-width="2"/>
    <circle cx="13" cy="24" r="8" fill="#9fc4d4"/>
    <text x="-6" y="205" fill="#9fc4d4" font-family="Consolas, monospace" font-size="14">serial: 1 block stream</text>
  </g>
  <!-- parallel fan (right of diagonal) -->
  <g transform="translate(200,30)" stroke="#7fd1f0" stroke-width="2" fill="none">
    <path d="M 0 120 C 60 120, 80 20, 150 20"/>
    <path d="M 0 120 C 60 120, 80 60, 150 60"/>
    <path d="M 0 120 C 60 120, 80 100, 150 100"/>
    <path d="M 0 120 C 60 120, 80 140, 150 140"/>
    <path d="M 0 120 C 60 120, 80 180, 150 180"/>
    <path d="M 0 120 C 60 120, 80 220, 150 220"/>
  </g>
  <g transform="translate(350,30)">
    <g fill="#7fd1f0">
      <rect x="0" y="8" width="20" height="24" rx="3"/>
      <rect x="0" y="48" width="20" height="24" rx="3"/>
      <rect x="0" y="88" width="20" height="24" rx="3"/>
      <rect x="0" y="128" width="20" height="24" rx="3"/>
      <rect x="0" y="168" width="20" height="24" rx="3"/>
      <rect x="0" y="208" width="20" height="24" rx="3"/>
    </g>
    <!-- identical results stack -->
    <g transform="translate(80,90)">
      <rect x="0" y="60" width="120" height="34" fill="#0c1a20" stroke="#e8b04b" stroke-width="2"/>
      <rect x="6" y="40" width="120" height="34" fill="#16323c" stroke="#e8b04b" stroke-width="2"/>
      <rect x="12" y="20" width="120" height="34" fill="#1f4250" stroke="#e8b04b" stroke-width="2"/>
      <text x="72" y="42" fill="#e8b04b" font-family="Consolas, monospace" font-size="15" text-anchor="middle">== result</text>
      <text x="72" y="82" fill="#e8b04b" font-family="Consolas, monospace" font-size="15" text-anchor="middle">bit-identical</text>
      <text x="72" y="120" fill="#7fd1f0" font-family="Consolas, monospace" font-size="13" text-anchor="middle">under ANY partition</text>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="640" y="112" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="0.5">Parallel <tspan fill="#7fd1f0">Numerics</tspan> <tspan fill="#e8b04b">Bench</tspan></text>
    <text x="642" y="154" fill="#b8d4e0" font-size="20">C++17 thread pool · deterministic workloads · honest timings</text>
    <text x="642" y="192" fill="#6f96a8" font-family="Consolas, monospace" font-size="14">counter RNG sample(stream, counter) · ≥7 repeats · sub-unity cells kept</text>
  </g>
</svg>
