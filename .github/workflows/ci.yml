name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - CMake + CTest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Linux, GCC, warnings as errors for pedantic headers)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Configure (Windows, MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run smoke benchmark (Linux)
        if: runner.os == 'Linux'
        run: ./build/pnb_bench --mode smoke

      - name: Run smoke benchmark (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/pnb_bench.exe --mode smoke
